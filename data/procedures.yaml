  priorita: urgente
  canale: di_persona
  stato_verifica: fonte_ufficiale
  istruzioni:
  - Ritira il kit giallo in un ufficio postale Sportello Amico
  - Allega copia di passaporto e visto, prova di mezzi economici e di alloggio
  - 'Consegna il kit, paga i costi e conserva la ricevuta: ti serve per residenza e sanità'
  - 'Vai in Questura il giorno indicato sulla ricevuta per le impronte: se non hai il codice fiscale, di norma te
    lo attribuiscono lì'
  instructions_en:
  - Pick up the yellow kit at a Sportello Amico post office
  - Attach copies of passport and visa, proof of means and of accommodation
  - 'Hand in the kit, pay the fees and keep the receipt: you need it for residence and healthcare'
  - 'Go to the Police HQ on the date on your receipt for fingerprints: if you have no tax code, it is normally assigned
    there'
