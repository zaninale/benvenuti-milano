- id: RES_U
  titolo: Iscriviti all'anagrafe
  title_en: Register as a resident
  ente: Comune di Milano
  ufficio: Comune, Anagrafe
  ambito: nucleo
  si_applica_a:
  - ue
  dipende_da: []
  scadenza:
    quantita: 90
    unita: giorni
    natura: scadenza_di_legge
    base: data_di_arrivo
  priorita: importante
  canale: online_o_di_persona
  stato_verifica: fonte_ufficiale
  firmatari: tutti i maggiorenni del nucleo; i minori sono inclusi
  istruzioni:
  - Obbligatoria se resti più di 3 mesi
  - Prepara la copia del documento d'identità valido, fronte e retro, e la documentazione sull'abitazione
  - Porta la prova del lavoro, oppure una dichiarazione di risorse sufficienti e un'assicurazione sanitaria
  - Se entri in una famiglia già residente senza legami di parentela, serve il consenso di chi è già residente
  - Presenta la richiesta online o all'anagrafe
  - 'Allegati in pdf, jpg, jpeg, gif o tiff, al massimo 7 MB ciascuno: i documenti inviati per email non sono accettati'
  instructions_en:
  - Required if you stay longer than 3 months
  - Have a copy of your valid ID, front and back, and documents about your home ready
  - Bring proof of work, or a statement of sufficient means and health insurance
  - If you join a resident household with no family ties, you need the consent of the person already resident
  - Apply online or at the registry office
  - 'Attachments in pdf, jpg, jpeg, gif or tiff, up to 7 MB each: documents sent by email are not accepted'
  link:
  - tipo: servizio_online
    etichetta: Richiesta online al Comune di Milano
    url: https://www.comune.milano.it/servizi/anagrafe/richiesta-di-residenza-per-persone-straniere-provenienti-dall-estero
