    unita: giorni_lavorativi
    natura: scadenza_di_legge
    base: data_di_arrivo
  priorita: urgente
  canale: di_persona
  stato_verifica: fonte_secondaria
  istruzioni:
  - Prendi appuntamento allo Sportello Unico Immigrazione insieme al datore di lavoro
  - Porta il passaporto con il visto d'ingresso
  - 'Firma il contratto di soggiorno: ti serve per chiedere il permesso'
  - Qui ricevi di norma anche il codice fiscale
  instructions_en:
  - Book an appointment at the Immigration Desk together with your employer
  - Bring your passport with the entry visa
  - 'Sign the residence contract: you need it to apply for the permit'
  - You normally get your tax code here too
  link: []
  fonti:
