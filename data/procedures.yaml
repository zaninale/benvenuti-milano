versione: '2026-10-03'
nota: 'Catalogo estratto dalla demo ''Benvenuti a Milano''. Le scadenze sono regole, non date: le date si calcolano
  dalla data di arrivo. stato_verifica e fonti vanno mostrati all''utente.'
regole_nucleo:
- 'Famiglia anagrafica: persone legate da matrimonio, unione civile, parentela, affinità, adozione, tutela o vincoli
  affettivi che vivono insieme. Una sola dichiarazione di residenza; firmano tutti i maggiorenni; i minori sono
  inclusi. (DPR 223/1989 e prassi comunali)'
- 'Provenienze diverse nello stesso nucleo (es. italiano da altro comune e familiare straniero dall''estero): dichiarazioni
  separate per provenienza. ANPR per chi è già iscritto in un comune italiano; procedura del Comune per chi arriva
  dall''estero.'
- 'Coinquilini senza legami di famiglia: nuclei anagrafici distinti allo stesso indirizzo, una dichiarazione ciascuno.'
- 'Dichiarazioni presentate da un tutore: allo sportello.'
- 'Verifica della dimora e TARI: un solo passo per l''abitazione. TARI: indicare quante persone ci vivono.'
regole_strumenti:
- Uno strumento (email, telefono, SIM, dispositivo, SPID/CIE) entra nel piano solo se un passo successivo ne ha
  bisogno.
- 'Lo SPID accetta anche un numero estero: la SIM italiana è consigliata, non necessaria.'
- 'SIM PosteMobile in ufficio postale: servono documento e codice fiscale. Suggerirla ''già che sei in posta'' solo
  a chi ha già il codice fiscale (es. lavoratore extra-UE dopo lo Sportello Unico); allo studente dire di comprarla
  dopo aver ricevuto il codice fiscale.'
- 'Senza SPID/CIE: TARI via email o raccomandata; residenza da altro comune all''anagrafe di persona.'
punti_in_conflitto:
- tema: Contributo SSN volontario studenti extra-UE
  fonti:
  - 'Ca'' Foscari: 700 euro/anno'
  - 'Politecnico: 149,77 euro (probabilmente superata)'
- tema: Chi verifica la dimora
  fonti:
  - 'YesMilano: messo comunale'
  - 'Guide di terzi: Polizia Locale'
- tema: SPID per stranieri con solo permesso di soggiorno
  fonti:
  - 'Corecom Piemonte: serve documento italiano'
  - 'Guide Poste/terzi: basta il permesso'
