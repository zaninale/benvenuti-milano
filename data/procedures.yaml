    cosa_dice: Codice fiscale attribuito dagli Sportelli Unici per il lavoro subordinato
    consultata: '2026-10-03'
- id: PERM_L
  titolo: Chiedi il permesso di soggiorno per lavoro
  title_en: Apply for a work residence permit
  ente: Stato
  ufficio: Ufficio postale, poi Questura
  ambito: persona
  si_applica_a:
  - extra_lavoro
  dipende_da:
  - SUI
  scadenza:
    quantita: 8
    unita: giorni_lavorativi
    natura: scadenza_di_legge
    base: data_di_arrivo
  priorita: urgente
  canale: di_persona
  stato_verifica: fonte_ufficiale
  istruzioni:
  - Ritira il kit giallo in un ufficio postale Sportello Amico
  - Compila il modulo e allega copia di passaporto e visto
  - 'Consegna il kit, paga i costi e conserva la ricevuta: ti serve per residenza e sanità'
  - Vai in Questura il giorno indicato sulla ricevuta per le impronte
  instructions_en:
  - Pick up the yellow kit at a Sportello Amico post office
  - Fill in the form and attach copies of passport and visa
  - 'Hand in the kit, pay the fees and keep the receipt: you need it for residence and healthcare'
  - Go to the Police HQ on the date on your receipt for fingerprints
  link:
  - tipo: informazioni
    etichetta: Guida Poste al permesso di soggiorno
    url: https://www.poste.it/prodotti/guida-rilascio-e-rinnovo-permesso-di-soggiorno.html
    requisiti: null
    verificato: true
  fonti:
  - url: https://www.poste.it/prodotti/guida-rilascio-e-rinnovo-permesso-di-soggiorno.html
    tipo: ufficiale
    cosa_dice: Domanda entro 8 giorni dall'ingresso, kit postale, ricevuta e appuntamento in Questura
    consultata: '2026-10-03'
- id: PERM_S
  titolo: Chiedi il permesso di soggiorno per studio
  title_en: Apply for a study permit
  ente: Stato
