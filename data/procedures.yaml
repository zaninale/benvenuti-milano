versione: '2026-10-03'
nota: 'Catalogo estratto dalla demo ''Benvenuti a Milano''. Le scadenze sono regole, non date: le date si calcolano
  dalla data di arrivo. stato_verifica e fonti vanno mostrati all''utente.'
regole_nucleo:
- 'Famiglia anagrafica: persone legate da matrimonio, unione civile, parentela, affinità, adozione, tutela o vincoli
  affettivi che vivono insieme. Una sola dichiarazione di residenza; firmano tutti i maggiorenni; i minori sono
  inclusi. (DPR 223/1989 e prassi comunali)'
- 'Provenienze diverse nello stesso nucleo (es. italiano da altro comune e familiare straniero dall''estero): dichiarazioni
  separate per provenienza. ANPR per chi è già iscritto in un comune italiano; procedura del Comune per chi arriva
  dall''estero.'
- 'Coinquilini senza legami di famiglia: nuclei anagrafici distinti allo stesso indirizzo, una dichiarazione ciascuno.'
- 'Dichiarazioni presentate da un tutore: allo sportello.'
- 'Verifica della dimora e TARI: un solo passo per l''abitazione. TARI: indicare quante persone ci vivono.'
regole_strumenti:
- Uno strumento (email, telefono, SIM, dispositivo, SPID/CIE) entra nel piano solo se un passo successivo ne ha
  bisogno.
- 'Lo SPID accetta anche un numero estero: la SIM italiana è consigliata, non necessaria.'
- 'SIM PosteMobile in ufficio postale: servono documento e codice fiscale. Suggerirla ''già che sei in posta'' solo
  a chi ha già il codice fiscale (es. lavoratore extra-UE dopo lo Sportello Unico); allo studente dire di comprarla
  dopo aver ricevuto il codice fiscale.'
- 'Senza SPID/CIE: TARI via email o raccomandata; residenza da altro comune all''anagrafe di persona.'
punti_in_conflitto:
- tema: Contributo SSN volontario studenti extra-UE
  fonti:
  - 'Ca'' Foscari: 700 euro/anno'
  - 'Politecnico: 149,77 euro (probabilmente superata)'
- tema: Chi verifica la dimora
  fonti:
  - 'YesMilano: messo comunale'
  - 'Guide di terzi: Polizia Locale'
- tema: SPID per stranieri con solo permesso di soggiorno
  fonti:
  - 'Corecom Piemonte: serve documento italiano'
  - 'Guide Poste/terzi: basta il permesso'
procedure:
- id: SUI
  titolo: Firma il contratto di soggiorno
  title_en: Sign the residence contract
  ente: Stato
  ufficio: Sportello Unico Immigrazione, Prefettura
  ambito: persona
  si_applica_a:
  - extra_lavoro
  dipende_da: []
  scadenza:
    quantita: 8
    unita: giorni_lavorativi
    natura: scadenza_di_legge
    base: data_di_arrivo
  priorita: urgente
  canale: di_persona
  stato_verifica: fonte_secondaria
  istruzioni:
  - Entro 8 giorni lavorativi dall'arrivo chiedi l'appuntamento allo Sportello Unico Immigrazione, insieme al datore
    di lavoro
  - Porta il passaporto con il visto d'ingresso
  - 'Firma il contratto di soggiorno: ti serve per chiedere il permesso'
  - Qui ricevi il modulo 209 e di solito anche il codice fiscale
  instructions_en:
  - Within 8 working days of arrival, book an appointment at the Immigration Desk together with your employer
  - Bring your passport with the entry visa
  - 'Sign the residence contract: you need it to apply for the permit'
  - Here you get form 209 and usually your tax code too
  link: []
  fonti:
  - url: https://studyandwork.yesmilano.it/en/work/getting-started-guide/residence-permit
    tipo: istituzionale
    cosa_dice: 'Appuntamento allo Sportello Unico da chiedere entro 8 giorni lavorativi dall''arrivo: contratto
      di soggiorno, modulo 209 e codice fiscale'
    consultata: '2026-10-03'
- id: PERM_L
  titolo: Chiedi il permesso di soggiorno per lavoro
  title_en: Apply for a work residence permit
  ente: Stato
  ufficio: Ufficio postale, poi Questura
  ambito: persona
  si_applica_a:
  - extra_lavoro
  dipende_da:
  - SUI
  scadenza:
    quantita: 8
    unita: giorni_lavorativi
    natura: scadenza_di_legge
    base: data_di_arrivo
  priorita: urgente
  canale: di_persona
  stato_verifica: fonte_ufficiale
  istruzioni:
  - Ritira il kit giallo in un ufficio postale Sportello Amico
  - Compila il modulo e allega la copia di tutte le pagine del passaporto con dati, visti e timbri
  - Allega la prova dell'alloggio (prenotazione, contratto d'affitto o dichiarazione di ospitalità), il modulo 209
    e il contratto di soggiorno
  - 'Consegna il kit, paga la marca da bollo da 16 € e il bollettino (70,46 € per un permesso fino a un anno, 80,46
    € da uno a due anni) e conserva la ricevuta: ti serve per residenza e sanità'
  - Vai in Questura il giorno indicato sulla ricevuta per le impronte
  instructions_en:
  - Pick up the yellow kit at a Sportello Amico post office
  - Fill in the form and attach copies of every passport page with data, visas and stamps
  - Attach proof of accommodation (booking, lease or hospitality declaration), form 209 and the residence contract
  - 'Hand in the kit, pay the 16 € revenue stamp and the payment slip (70.46 € for a permit up to one year, 80.46
    € for one to two years) and keep the receipt: you need it for residence and healthcare'
  - Go to the Police HQ on the date on your receipt for fingerprints
  link:
  - tipo: informazioni
    etichetta: Guida Poste al permesso di soggiorno
    url: https://www.poste.it/prodotti/guida-rilascio-e-rinnovo-permesso-di-soggiorno.html
    requisiti: null
    verificato: true
  - tipo: servizio_online
    etichetta: 'Portale Immigrazione: uffici abilitati e stato della pratica'
    url: https://www.portaleimmigrazione.it/
    requisiti: null
    verificato: true
  fonti:
  - url: https://www.poste.it/prodotti/guida-rilascio-e-rinnovo-permesso-di-soggiorno.html
    tipo: ufficiale
    cosa_dice: Domanda entro 8 giorni dall'ingresso, kit postale, ricevuta e appuntamento in Questura
    consultata: '2026-10-03'
  - url: https://poliziadistato.it/articolo/225-Il_rilascio_del_permesso_di_soggiorno
    tipo: ufficiale
    cosa_dice: 'Rilascio del permesso di soggiorno: kit postale, documenti e costi (marca da bollo 16 €, bollettino
      70,46 € o 80,46 €)'
    consultata: '2026-10-03'
